/* FULL OPTION brand identity */
:root{--brand-navy:#0E0F3B;--brand-blue:#07407B;--brand-cyan:#7FCDEE;--brand-orange:#F7931E;}
.brand-logo{display:block;width:clamp(132px,19vw,205px);height:auto;max-height:62px;object-fit:contain;}
.logo{display:flex;align-items:center;min-width:0;}
.cat i{height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.cat i img{width:48px;height:48px;object-fit:contain;display:block;border-radius:9px;}
#brandSplash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#ffffff 0%,#edf7fc 48%,#dbeefa 100%);transition:opacity .35s ease,visibility .35s ease;}
#brandSplash img{width:min(78vw,440px);height:auto;max-height:34vh;object-fit:contain;}
#brandSplash.done{opacity:0;visibility:hidden;pointer-events:none;}
.splash-loading{display:flex;align-items:center;gap:10px;color:#07407B;font-weight:700;font-size:17px;letter-spacing:.5px;}
.loader-dot{width:18px;height:18px;border:3px solid #7FCDEE;border-top-color:#F7931E;border-radius:50%;animation:foSpin .75s linear infinite;}

/* ---------------- عناصر
السلة: منتج عادي أو باقة (pkg:ID) ---------------- */

function item(id) {

  if
(String(id).startsWith("pkg:")) { const k = K.find(x => x.id ===
id.slice(4)); if (!k) return null; const first = P.find(p => p.id ===
k.product_ids[0]);

    return { id, pkg:
true, name: k.name, name_ar: k.name_ar, price: k.price, image: k.image ||
(first && first.image) || "", stock: k.stock, free:
k.free_shipping, ref: k }; }

  const p = P.find(x => x.id === id); return p ? { id, pkg: false, name: p.name, name_ar:
p.name_ar, price: price(p), image: p.image, stock: p.stock, free:
p.free_shipping, ref: p } : null;

}

function totals() {

  const lines =
Object.entries(CART).map(([id, q]) => { const it = item(id); return it ? {
it, q, t: it.price * q } : null; }).filter(Boolean), sub = lines.reduce((a, l) => a + l.t, 0);

  const disc = COUPON
? Math.min(COUPON.discount, sub) : 0, fl = SET.free_shipping_rule ===
"all" ? lines.length && lines.every(l => l.it.free) :
lines.some(l => l.it.free);

  const ship =
lines.length ? ((fl || (SET.free_shipping_over > 0 && sub - disc
>= SET.free_shipping_over)) ? 0 : SET.shipping_fee) : 0;

  return { lines, sub,
disc, ship, total: sub - disc + ship };

}

const count = () => Object.values(CART).reduce((a, b) => a + b, 0);

function saveCart() { sv("cart", CART);
$("#cc").textContent = count(); }

function add(id, n = 1) { const it = item(id); if (!it)
return; const q = (CART[id] || 0) + n; if (it.stock != null && q >
it.stock) return toast(t("stock") + " " + it.stock);
CART[id] = q; if (q <= 0) delete CART[id]; saveCart(); revalidate(); }

async function revalidate() { if (COUPON) await
applyCoupon(COUPON.code, true); if (/^#\/(cart|checkout)/.test(location.hash))
route(); }

async function applyCoupon(code, silent) {

  const sub =
totals().sub; let r;

  if (demo()) { const
c = { WELCOME10: p => p * .1, SAVE20: p => p >= 100 ? 20 : -1
}[String(code).toUpperCase()]; const d = c ? c(sub) : -1; r = d >= 0 ? { ok:
true, code: String(code).toUpperCase(), discount: Math.round(d * 100) / 100 } :
{ ok: false, error: "الكوبون غير صحيح أو لا ينطبق",
error_en: "Invalid coupon or not applicable (try WELCOME10)" }; }

  else r = await
api(null, { action: "coupon", code, subtotal: sub });

  if (r.ok) { COUPON =
{ code: r.code, discount: r.discount }; sv("coupon", COUPON); if
(!silent) toast(t("applied")); } else { COUPON = null;
sv("coupon", null); if (!silent) toast(isAr() ? r.error : (r.error_en
|| r.error)); }

  return r;

}

/* ---------------- تحميل
البيانات: الواجهة أولاً ثم البيانات في الخلفية ---------------- */

const CK = "fo_data_v2", MAX_AGE = 6 * 3600 * 1000; // cache lasts up to six hours

function applyData(d, cached) {

  P = d.products ||
[]; K = d.packages || []; CONTENT = d.content || {}; Object.assign(SET,
d.settings || {}); if (SET.store_name === "متجري"
|| !SET.store_name) SET.store_name = "Full Options";

  CATS = (d.categories
&& d.categories.length) ? d.categories.map(c => ({ ...c, icon:
ICONS[c.id] })) : DEF_CATS; ready = true; errored = false; fromCache =
!!cached; hideSplash();

  if (!cached) { try {
localStorage.setItem(CK, JSON.stringify({ t: Date.now(), d })); } catch (e) {}
}

 
Object.keys(CART).forEach(id => { if (!item(id)) delete CART[id]; });
saveCart(); route();

}

function failed() { hideSplash(); errored = true; if (!ready) { ready =
true; P = []; K = []; } route(); }

function loadFresh() {

  errored = false; if
(!ready) route(); if (demo()) return applyData(DEMO);

  fetch(CONFIG.API_URL
+ "?action=bootstrap").then(r => r.json()).then(d => { if (d
&& d.ok && d.products) applyData(d); else failed();
}).catch(failed);

}

(function start() {

  saveCart();
chrome(); route();                                    // 1) الواجهة تظهر فوراً

  if (demo()) return
applyData(DEMO);

  let c = null; try {
c = JSON.parse(localStorage.getItem(CK)); } catch (e) {}

  if (c && c.d
&& Date.now() - c.t < MAX_AGE) applyData(c.d, true); // cached data immediately when available

  (window.__boot ||
Promise.resolve(null)).then(d => { if (d && d.ok &&
d.products) applyData(d); else failed(); });  
// fresh data replaces cached data in the background

  setTimeout(() =>
{ if (!ready) failed(); }, 15000);              
// show a message if Google Apps Script is slow

})();
