/* ---------------- لوحة الإدارة ---------------- */

  if (demo()) return '<div class="box"><h1>لوحة الإدارة</h1><p>اربط المتجر برابط Google Apps Script (CONFIG.API_URL) لتفعيل لوحة الإدارة.</p></div>';

async function adminTab(t) {
  const key = sessionStorage.getItem("akey"), box = $("#adm"); document.querySelectorAll("[data-at]").forEach(b => b.classList.toggle("on", b.dataset.at === t));
  if (t === "out") { sessionStorage.removeItem("akey"); return route(); }
  if (t === "prod") { box.innerHTML = `<div class="box"><label>رابط المنتج (AliExpress أو أي موقع)<div class="row"><input id="pu" placeholder="https://..." style="flex:1"><button class="btn" id="pimp">استيراد البيانات</button></div></label><p class="mini" style="color:var(--mut)">إن منع الموقع القراءة الآلية (يحدث أحياناً مع علي إكسبريس وأمازون) أدخل البيانات يدوياً. عدّل السعر لإضافة هامش ربحك.</p><div id="imsg"></div>
    <div class="g2"><label>اسم المنتج (English) *<input id="pn"></label><label>اسم المنتج (عربي)<input id="pna"></label><label>القسم (ID مثل interior / exterior / lighting / sensors / decoration / electronic / other)<input id="pc" placeholder="interior"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pfs" style="width:auto">شحن مجاني لهذا المنتج</label><label>السعر الأساسي *<input id="pp" type="number" step="0.01"></label><label>سعر الخصم (اختياري)<input id="ps" type="number" step="0.01"></label><label>رابط الصورة الرئيسية<input id="pi"></label><label>الكمية المتاحة (فارغ = غير محدود)<input id="pst" type="number"></label></div>
    <label>صور إضافية (روابط تفصلها مسافة)<input id="pim"></label><label>الوصف (English)<textarea id="pd" rows="2"></textarea></label><label>الوصف (عربي)<textarea id="pda" rows="2"></textarea></label><input type="hidden" id="psrc"><button class="btn" id="psave">حفظ المنتج في المتجر</button></div>`;
    $("#pimp").onclick = async () => { $("#imsg").textContent = "جاري القراءة..."; try { const r = await api({ action: "import", key, url: $("#pu").value }); if (!r.ok) { $("#imsg").innerHTML = `<p class="err">${esc(r.error)}</p>`; return; } $("#pn").value = r.name; $("#pi").value = r.image; $("#pd").value = r.description; $("#pp").value = r.price; $("#psrc").value = r.source_url; $("#imsg").innerHTML = '<p class="ok">تم الاستيراد. راجع البيانات وحدّد السعر.</p>'; } catch (e) { $("#imsg").innerHTML = '<p class="err">فشل الاتصال</p>'; } };
    $("#psave").onclick = async () => { const r = await api({ action: "addProduct", key, product: { name: $("#pn").value, category: $("#pc").value, price: $("#pp").value, sale_price: $("#ps").value, image: $("#pi").value, images: $("#pim").value, description: $("#pd").value, name_ar: $("#pna").value, description_ar: $("#pda").value, free_shipping: $("#pfs").checked, stock: $("#pst").value, source_url: $("#psrc").value } }); if (r.ok) { toast("تمت إضافة المنتج"); loadFresh(); adminTab("prod"); } else toast(r.error); };
  }
  if (t === "ord") { box.innerHTML = "جاري التحميل..."; const r = await api({ action: "orders", key }); if (!r.ok) return box.innerHTML = `<p class="err">${esc(r.error)}</p>`;
    box.innerHTML = `<div class="box" style="overflow:auto"><table><thead><tr><th>الطلب</th><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody>${r.orders.map(o => `<tr><td>${esc(o.order_no)}</td><td>${esc(o.date)}</td><td>${esc(o.name)}</td><td><a href="https://wa.me/${esc(String(o.phone).replace(/\D/g, ""))}" target="_blank" rel="noopener">${esc(o.phone)}</a></td><td>${esc(o.city)} ${esc(o.address)}</td><td>${esc(o.items)}</td><td>${esc(o.total)}</td>
    <td><select data-os="${esc(o.order_no)}">${["جديد", "تم التأكيد", "تم الشحن", "تم التسليم", "ملغي"].map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`;
    box.querySelectorAll("[data-os]").forEach(s => s.onchange = async () => { const x = await api({ action: "setStatus", key, order_no: s.dataset.os, status: s.value }); toast(x.ok ? "تم التحديث" : x.error); }); }
}

/* ---------------- التوجيه والأحداث ---------------- */
function chrome() {
  document.documentElement.lang = LANG; document.documentElement.dir = isAr() ? "rtl" : "ltr";
  const h = location.hash.slice(2).split("/")[0] || "home", MAP = { home: ["home"], cats: ["categories", "cat", "products", "p"], pkgs: ["packages", "pkg"], req: ["request"], refund: ["refund"], sales: ["sales"] };
  $("#nav").innerHTML = [["home", "#/"], ["cats", "#/categories"], ["pkgs", "#/packages"], ["req", "#/request"], ["refund", "#/refund"], ["sales", "#/sales"]].map(([k, href]) => `<a href="${href}" class="${MAP[k].includes(h) ? "on" : ""}">${t(k)}</a>`).join("") +
    `<span class="langsw" aria-label="${t("lang")}"><button data-lang="ar" class="${isAr() ? "on" : ""}">العربية</button><button data-lang="en" class="${isAr() ? "" : "on"}">English</button></span>`;
  $("#slg").textContent = isAr() ? (SET.slogan_ar || T.ar.slogan) : (SET.slogan_en || T.en.slogan); $("#cartl").textContent = t("cart"); $("#ann").textContent = SET.announcement || "";
  $("#foot").innerHTML = `<div><b>Full Options</b> | ${esc(isAr() ? (SET.slogan_ar || T.ar.slogan) : (SET.slogan_en || T.en.slogan))}</div><div style="margin:8px 0"><a href="#/">${t("home")}</a><a href="#/packages">${t("pkgs")}</a><a href="#/request">${t("req")}</a><a href="#/refund">${t("refund")}</a><a href="#/sales">${t("sales")}</a><a href="#/orders">${t("myOrders")}</a></div><div>${t("pay")} | <a href="https://wa.me/${waNum()}" target="_blank" rel="noopener">${t("contact")}</a></div><div style="margin-top:6px">© Full Options. ${t("rights")}</div>`;
  document.title = "Full Options | " + (isAr() ? T.ar.slogan : "Full Options"); const m = document.querySelector("meta[name=description]"); if (m && CONTENT.site_description) m.content = isAr() ? (CONTENT.site_description.ar || m.content) : (CONTENT.site_description.en || m.content);
  $("#nav").classList.remove("open"); $("#burger").setAttribute("aria-expanded", "false");
}
function route() {
  chrome(); const h = location.hash.slice(2).split("/"), v = h[0] || "home", a = $("#app");
  a.innerHTML = (V[v] || V.home)(decodeURIComponent(h[1] || "")); if (!/^(cart|checkout)$/.test(v) || true) window.scrollTo(0, 0);
  const hq = $("#hq"); if (hq) hq.onkeydown = e => { if (e.key === "Enter") { Q = hq.value; location.hash = "#/products"; } };
  const q = $("#q"); if (q) q.oninput = e => { Q = e.target.value; const p = e.target.selectionStart; route(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  if (v === "admin" && sessionStorage.getItem("akey") && !demo()) adminTab("prod");
  if (v === "admin" && $("#akb")) $("#akb").onclick = async () => { const k = $("#ak").value; const r = await api({ action: "orders", key: k }); if (r.ok) { sessionStorage.setItem("akey", k); route(); } else $("#akerr").textContent = r.error; };
  if (v === "cart" && $("#cpb")) $("#cpb").onclick = async () => { await applyCoupon($("#cpn").value); route(); };
  if (v === "checkout" && $("#co")) $("#co").onsubmit = placeOrder;
  if (v === "request" && $("#rf")) $("#rf").onsubmit = sendRequest;
}
async function placeOrder(e) {
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), tt = totals(), btn = $("#place"); btn.disabled = true; btn.textContent = t("placing");
  sv("me", { name: f.name, phone: f.phone, city: f.city, address: f.address });
  try {
    let o;
    if (demo()) { o = { order_no: "ORD-" + (1001 + ls("orders", []).length), date: new Date().toISOString().slice(0, 16).replace("T", " "), name: f.name, phone: f.phone, city: f.city, address: f.address, notes: f.notes, demo: true,
      lines: tt.lines.map(l => ({ name: l.it.name, name_ar: l.it.name_ar, price: l.it.price, qty: l.q, total: l.t })), subtotal: tt.sub, discount: tt.disc, coupon: COUPON ? COUPON.code : "", shipping: tt.ship, total: tt.total }; }
    else { const r = await api({ action: "order", website: f.website, customer: f, items: Object.entries(CART).map(([id, qty]) => ({ id, qty })), coupon: COUPON ? COUPON.code : "" }); if (!r.ok) throw new Error(isAr() ? r.error : (r.error_en || r.error)); o = r.order; }
    sv("orders", [o, ...ls("orders", [])].slice(0, 30)); CART = {}; COUPON = null; sv("coupon", null); saveCart(); location.hash = "#/invoice/" + o.order_no;
    if (!demo()) window.open(`https://wa.me/${waNum()}?text=${encodeURIComponent(waText(o))}`, "_blank");
  } catch (err) { $("#coerr").textContent = (err && err.message && err.message !== "Failed to fetch" && !/^(server error|rejected)$/.test(err.message)) ? err.message : t("fail"); btn.disabled = false; btn.textContent = t("confirm"); }
}
async function sendRequest(e) {
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), btn = $("#rsend"); btn.disabled = true; btn.textContent = t("sending"); $("#rerr").textContent = "";
  try {
    let id = "SR-DEMO"; if (!demo()) { const r = await api({ action: "request", website: f.website, request: f }); if (!r.ok) throw new Error(isAr() ? r.error : (r.error_en || r.error)); id = r.id; }
    const txt = `${t("reqNew")} ${id}\n${t("rName")}: ${f.name}\n${t("rMake")}: ${f.make} ${f.model} ${f.year}\n${t("rProd")}: ${f.product}`;
    $("#rf").style.display = "none"; $("#rok").innerHTML = `<div class="box note"><h2>✅ ${t("rOk")}</h2><p>${t("rId")}: <b>${esc(id)}</b> ${demo() ? "<br><b>" + t("demo") + "</b>" : ""}</p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${waNum()}?text=${encodeURIComponent(txt)}">${t("rPhotoWa")}</a> <a class="btn sec" href="#/">${t("cont")}</a></div>`; window.scrollTo(0, 0);
  } catch (err) { $("#rerr").textContent = (err && err.message && err.message !== "Failed to fetch" && !/^(server error|rejected)$/.test(err.message)) ? err.message : t("fail"); btn.disabled = false; btn.textContent = t("rSend"); }
}
document.addEventListener("click", e => {
  const el = e.target; let n;
  if ((n = el.closest("[data-add]"))) { add(n.dataset.add, +n.dataset.n || 1); if (!n.closest("table")) toast(t("added")); else route(); }
  else if ((n = el.closest("[data-rm]"))) { delete CART[n.dataset.rm]; saveCart(); revalidate(); route(); }
  else if ((n = el.closest("[data-buy]"))) { add(n.dataset.buy); location.hash = "#/checkout"; }
  else if ((n = el.closest("[data-go]"))) location.hash = n.dataset.go;
  else if ((n = el.closest("[data-img]"))) { $("#mainimg").src = n.dataset.img; document.querySelectorAll(".thumbs img").forEach(i => i.classList.toggle("on", i === n)); }
  else if ((n = el.closest("[data-at]"))) adminTab(n.dataset.at);
  else if ((n = el.closest("[data-lang]"))) { LANG = n.dataset.lang; sv("fo_lang", LANG); route(); }
  else if (el.closest("[data-retry]")) loadFresh();
  else if (el.closest("#cartb")) location.hash = "#/cart";
  else if (el.closest("#burger")) { const o = $("#nav").classList.toggle("open"); $("#burger").setAttribute("aria-expanded", o); }
  else if (el.closest("#nav a")) $("#nav").classList.remove("open");
});
window.onhashchange = route;
/* ---------------- تحميل البيانات: الواجهة أولاً ثم البيانات في الخلفية ---------------- */
const CK = "fo_data_v2", MAX_AGE = 6 * 3600 * 1000;      // الكاش صالح 6 ساعات كحد أقصى، والبيانات الجديدة تستبدله دائماً
function applyData(d, cached) {
  P = d.products || []; K = d.packages || []; CONTENT = d.content || {}; Object.assign(SET, d.settings || {}); if (SET.store_name === "متجري" || !SET.store_name) SET.store_name = "Full Options";
  CATS = (d.categories && d.categories.length) ? d.categories.map(c => ({ ...c, icon: ICONS[c.id] })) : DEF_CATS; ready = true; errored = false; fromCache = !!cached;
  if (!cached) { try { localStorage.setItem(CK, JSON.stringify({ t: Date.now(), d })); } catch (e) {} }
  Object.keys(CART).forEach(id => { if (!item(id)) delete CART[id]; }); saveCart(); route();
}
function failed() { errored = true; if (!ready) { ready = true; P = []; K = []; } route(); }
function loadFresh() {
  errored = false; if (!ready) route(); if (demo()) return applyData(DEMO);
  fetch(CONFIG.API_URL + "?action=bootstrap").then(r => r.json()).then(d => { if (d && d.ok && d.products) applyData(d); else failed(); }).catch(failed);
}
(function start() {
  saveCart(); chrome(); route();                                    // 1) الواجهة تظهر فوراً
  if (demo()) return applyData(DEMO);
  let c = null; try { c = JSON.parse(localStorage.getItem(CK)); } catch (e) {}
  if (c && c.d && Date.now() - c.t < MAX_AGE) applyData(c.d, true);  // 2) بيانات الكاش فوراً إن وُجدت
  (window.__boot || Promise.resolve(null)).then(d => { if (d && d.ok && d.products) applyData(d); else failed(); });   // 3) البيانات الحديثة تصل في الخلفية وتستبدل الكاش
  setTimeout(() => { if (!ready) failed(); }, 15000);               // لا نترك الموقع بلا رسالة إذا تأخر Google
})();
</script></body></html>
